
name: Construir Dragon Zeta APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Revisar AndroidManifest
        run: |
          echo "=== CONTENIDO DEL MANIFEST ==="
          cat -n app/src/main/AndroidManifest.xml
          echo "=== VALIDAR XML ==="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('MANIFEST XML CORRECTO')"

      - name: Construir APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DragonZeta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
